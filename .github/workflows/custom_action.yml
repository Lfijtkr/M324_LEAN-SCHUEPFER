name: Review Exercise Markdown

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  markdown_quality:
    name: Lint the exercise report
    runs-on: ubuntu-latest
    steps:
      - name: Fetch the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check Markdown style
        uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
        with:
          globs: 'Exercise_11e.md'