name: Exercise 2 Quality Checks

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exercise_quality:
    name: Check JavaScript quality
    runs-on: ubuntu-latest
    steps:
      - name: Fetch the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Node.js 22 LTS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.x'

      - name: Install locked dependencies
        run: npm ci

      - name: Check JavaScript lint rules
        run: npm run lint

      - name: Check Prettier formatting
        run: npm run format:check

      - name: Run Mocha unit tests
        run: npm test

  weekly_docs:
    name: Review exercise documentation
    if: github.event_name == 'schedule'
    uses: ./.github/workflows/custom_action.yml